<style>
:root{
  --paper:#f7f8f9; --surface:#fff; --ink:#15181c; --ink-soft:#5b646e;

*{box-sizing:border-box}

.eyebrow{margin:0;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;

h1{margin:2px 0 0;font-size:18px;font-weight:600;letter-spacing:-.01em}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-soft)}
input{font:14px var(--sans);padding:8px 10px;border:1px solid var(--rule-hard);border-radius:3px;
      background:var(--paper);color:var(--ink)}

button{font:600 13px var(--sans);padding:9px;border:1px solid var(--accent);border-radius:3px;
       background:var(--accent);color:var(--surface);cursor:pointer}
button:hover:not(:disabled){background:var(--ink);border-color:var(--ink)}
button:disabled{opacity:.55;cursor:default}
#err{margin:0;font-size:12.5px;font-weight:600;color:var(--fail);min-height:1.2em}
.hint{margin:0;font-size:11.5px;color:var(--ink-soft);line-height:1.5}

function bytes(b64){
  var s = atob(b64), a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
function hex(buf){
  return Array.prototype.map.call(new Uint8Array(buf), function(b){
    return ('0' + b.toString(16)).slice(-2);
  }).join('');
}

var form = document.getElementById('f'),
    err  = document.getElementById('err'),
    go   = document.getElementById('go');

form.addEventListener('submit', function(ev){
  ev.preventDefault();
  var email = document.getElementById('email').value.trim().toLowerCase(),
      pw    = document.getElementById('pw').value;

  err.textContent = '';
  go.disabled = true;
  go.textContent = 'Checking…';

  if (!window.crypto || !crypto.subtle) {
    fail('This browser cannot decrypt the page. Try Safari or Chrome over https.');
    return;
  }

  var enc = new TextEncoder();

  crypto.subtle.digest('SHA-256', enc.encode(email)).then(function(h){
    if (hex(h) !== P.emailHash) throw new Error('bad');
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  }).then(function(base){
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }).then(function(key){
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data));
  }).then(function(plain){
    var html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  }).catch(function(){
    fail('Wrong email or password.');
  });

  function fail(msg){
    err.textContent = msg;
    go.disabled = false;
    go.textContent = 'Open dashboard';
    document.getElementById('pw').select();
  }
});
</script></body></html>
